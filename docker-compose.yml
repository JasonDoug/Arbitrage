name: predictarb

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://predictarb:${POSTGRES_PASSWORD:-predictarb}@db:5432/predictarb
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: predictarb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predictarb}
      POSTGRES_DB: predictarb
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictarb"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    <<: *backend
    command: ["predictarb-api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      retries: 5

  ingest:
    <<: *backend
    command: ["predictarb-ingest"]
    depends_on:
      api: { condition: service_healthy }  # api runs migrations on startup

  web:
    build: ./web
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]

volumes:
  db-data:
  redis-data:
